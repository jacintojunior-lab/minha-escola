<link rel="stylesheet" href="css/responsive.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header class="topbar">
  <div class="topbar-left">
    <button id="btnMenu">☰</button>

    <div class="topbar-logo">
      <img src="assets/logo.jpg" alt="Logo">
      <h2>Sistema Escolar</h2>
    </div>
  </div>

  <div class="busca-global">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input
      type="search"
      id="buscaGlobal"
      placeholder="Buscar aluno por nome ou RGA..."
      autocomplete="off">
    <div id="resultadoBuscaGlobal" class="resultado-busca-global"></div>
  </div>

  <div class="topbar-right">
    <div class="usuario-info">
      <div id="usuarioNome"></div>
      <small id="usuarioPerfil"></small>
    </div>

    <button id="btnSair" class="btn-sair">
      <i class="fa-solid fa-right-from-bracket"></i>
      Sair
    </button>
  </div>
</header>

<div class="layout">

<aside class="sidebar" id="sidebar">
<button id="btnFecharMenu" class="btn-fechar-menu">
  <i class="fa-solid fa-xmark"></i>
</button>

<nav class="sidebar-menu">
  <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
  <a href="cadastro.html"><i class="fa-solid fa-clipboard-list"></i> Cadastro</a>
  <a href="alunos.html"><i class="fa-solid fa-user-graduate"></i> Alunos</a>
  <a href="carometro.html"><i class="fa-solid fa-id-badge"></i> Carômetro</a>
  <a href="irmaos.html"><i class="fa-solid fa-people-roof"></i> Irmãos</a>
  <a href="pais.html"><i class="fa-solid fa-people-roof"></i> Pais</a>
  <a href="relatorios.html"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
  <a href="contato.html"><i class="fa-brands fa-whatsapp"></i> Contato</a>
  <a href="declaracoes.html"><i class="fa-solid fa-file-signature"></i> Declarações</a>
  <a href="formularios.html"><i class="fa-solid fa-folder-open"></i> Formulários</a>
  <a href="turmas.html"><i class="fa-solid fa-school"></i> Turmas</a>
  <a href="funcionarios.html" class="ativo"><i class="fa-solid fa-user-tie"></i> Funcionários</a>
  <a href="leitura-doc.html"><i class="fa-solid fa-newspaper"></i> Leitura DOC</a>
  <a href="ferramentas-pdf.html"><i class="fa-solid fa-file-pdf"></i> Ferramentas PDF</a>
  <a href="transporte.html"><i class="fa-solid fa-bus"></i> Transporte</a>
  <a href="cesta-basica.html"><i class="fa-solid fa-basket-shopping"></i> Cesta Básica</a>

</nav>
</aside>

<main class="conteudo">

<section class="card">
<h2><i class="fa-solid fa-user-plus"></i> Cadastrar Funcionário</h2>

<form id="formFuncionario" class="form-aluno">
  <input type="text" id="rf" placeholder="RF (Registro Funcional)" required>
  <input type="text" id="nomeFuncionario" placeholder="Nome" required>
  <input type="text" id="cargoFuncionario" placeholder="Cargo" required>

  <button type="submit" class="btn-principal">
    <i class="fa-solid fa-floppy-disk"></i>
    Salvar
  </button>
</form>
</section>

<section class="card">
<div class="cabecalho-secao">
  <h2><i class="fa-solid fa-users-gear"></i> Funcionários Cadastrados</h2>

  <div class="acoes-csv">
    <button class="btn-sec" id="btnExportarCSV">
      <i class="fa-solid fa-file-csv"></i>
      Exportar CSV
    </button>

    <input type="file" id="importarCSV" accept=".csv" hidden>

    <button class="btn-sec" id="btnImportarCSV">
      <i class="fa-solid fa-upload"></i>
      Importar CSV
    </button>
  </div>
</div>

<div class="tabela-container">
<table>
<thead>
<tr>
<th>RF</th>
<th>Nome</th>
<th>Cargo</th>
<th>Ações</th>
</tr>
</thead>

<tbody id="listaFuncionarios"></tbody>
</table>
</div>
</section>

</main>
</div>

<footer class="footer">
  <p id="footerTexto"></p>
</footer>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/core/layout.js"></script>
<script type="module" src="js/modules/funcionarios.js"></script>

</body>
</html>
