<!-- CADASTRO -->
<section class="card">

<h2>Cadastrar Funcionário</h2>

<form id="formFuncionario" class="form-aluno">

<input type="text" id="rf" placeholder="RF (Registro Funcional)" required>

<input type="text" id="nomeFuncionario" placeholder="Nome" required>

<input type="text" id="cargoFuncionario" placeholder="Cargo" required>

<button type="submit" class="btn-principal">
Salvar
</button>

</form>

</section>

<!-- LISTA -->
<section class="card">

<h2>Funcionários Cadastrados</h2>



<div class="tabela-container">

<table>
<thead>
<tr>
<th>RF</th>
<th>Nome</th>
<th>Cargo</th>
<th>Ações</th>
</tr>
</thead>

<tbody id="listaFuncionarios"></tbody>

</table>

</div>

<div style="margin-bottom:10px; display:flex; gap:10px;">

<i class="fa-solid fa-file-csv"></i> Exportar CSV
</button>
