href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header class="topbar">
  <div class="topbar-left">
    <button id="btnMenu">☰</button>

    <div class="topbar-logo">
      <img src="assets/logo.jpg" alt="Logo">
      <h2>Sistema Escolar</h2>
    </div>
  </div>

  <div class="busca-global">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input
      type="search"
      id="buscaGlobal"
      placeholder="Buscar aluno por nome ou RGA..."
      autocomplete="off">
    <div id="resultadoBuscaGlobal" class="resultado-busca-global"></div>
  </div>

  <div class="topbar-right">
    <div class="usuario-info">
      <div id="usuarioNome"></div>
      <small id="usuarioPerfil"></small>
    </div>

    <button id="btnSair" class="btn-sair">
      <i class="fa-solid fa-right-from-bracket"></i>
      Sair
    </button>
  </div>
</header>

<div class="layout">

<aside class="sidebar" id="sidebar">
<button id="btnFecharMenu" class="btn-fechar-menu">
  <i class="fa-solid fa-xmark"></i>
</button>

<nav class="sidebar-menu">
  <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
  <a href="cadastro.html"><i class="fa-solid fa-clipboard-list"></i> Cadastro</a>
  <a href="alunos.html"><i class="fa-solid fa-user-graduate"></i> Alunos</a>

  <a href="pais.html"><i class="fa-solid fa-people-roof"></i> Pais</a>
  <a href="relatorios.html"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
  <a href="contato.html"><i class="fa-brands fa-whatsapp"></i> Contato</a>
  <a href="declaracoes.html"><i class="fa-solid fa-file-signature"></i> Declarações</a>
  <a href="formularios.html"><i class="fa-solid fa-folder-open"></i> Formulários</a>
  <a href="turmas.html" class="ativo"><i class="fa-solid fa-school"></i> Turmas</a>
  <a href="funcionarios.html"><i class="fa-solid fa-user-tie"></i> Funcionários</a>

  <a href="configuracoes.html"><i class="fa-solid fa-gear"></i> Configurações</a>
</nav>
</aside>

<main class="conteudo">

<section class="card">
<h2><i class="fa-solid fa-plus"></i> Nova Turma</h2>

<form id="formTurma" class="form-aluno">

<input type="text" id="nomeTurma" placeholder="Nome (ex: 3A)" required>

<select id="serie" required>
<option value="">Selecione a Série</option>
<option>1º ANO</option>
<option>2º ANO</option>
<option>3º ANO</option>
<option>4º ANO</option>
<option>5º ANO</option>
<option>6º ANO</option>
<option>7º ANO</option>
<option>8º ANO</option>
<option>9º ANO</option>
<option>1º EM</option>
<option>2º EM</option>
<option>3º EM</option>
</select>

<select id="tipoEnsino" required>
<option value="">Tipo de Ensino</option>
<option>Ensino Fundamental de 9 anos</option>
<option>Ensino Médio</option>
</select>

<select id="periodo">
<option>Manhã</option>
<option>Tarde</option>
<option>Integral</option>
<option>Noite</option>
</select>

<input type="text" id="horario" placeholder="07:00 - 11:30">
<input type="number" id="capacidade" placeholder="Capacidade máxima" required>

<select id="statusTurma">
<option>Ativa</option>
<option>Concluída</option>
<option>Inativa</option>
</select>

<input type="number" id="anoLetivoTurma" placeholder="Ano letivo">
<input type="text" id="professorTurma" placeholder="Professor(a) da turma">

<button type="submit" class="btn-principal">
  <i class="fa-solid fa-floppy-disk"></i>
  Salvar Turma
</button>

</form>
</section>

<section class="card">
<div class="cabecalho-secao">
  <h2><i class="fa-solid fa-school"></i> Turmas Cadastradas</h2>

  <div class="acoes-csv">
    <button class="btn-sec" id="btnExportarTurmas">
      <i class="fa-solid fa-file-csv"></i>
      Exportar
    </button>

    <input type="file" id="importarTurmasCSV" accept=".csv" hidden>

    <button class="btn-sec" id="btnImportarTurmas">
      <i class="fa-solid fa-upload"></i>
      Importar
    </button>
  </div>
</div>

<div id="listaTurmas"></div>
</section>

</main>
</div>

<footer class="footer">
  <p id="footerTexto"></p>
</footer>

<div class="modal" id="modalTurma">
<div class="modal-conteudo">

<h3>Editar Turma</h3>

<form id="formEditarTurma" class="form-aluno">

<div class="campo-form">
<label>Nome da Turma</label>
<input type="text" id="editNome" required>
</div>

<div class="campo-form">
<label>Série</label>
<select id="editSerie">
<option value="">Selecione uma opção</option>
<option>1º ANO</option>
<option>2º ANO</option>
<option>3º ANO</option>
<option>4º ANO</option>
<option>5º ANO</option>
<option>6º ANO</option>
<option>7º ANO</option>
<option>8º ANO</option>
<option>9º ANO</option>
<option>1º EM</option>
<option>2º EM</option>
<option>3º EM</option>
</select>
</div>

<div class="campo-form">
<label>Tipo de Ensino</label>
<select id="editTipoEnsino">
<option value="">Selecione uma opção</option>
<option>Ensino Fundamental de 9 anos</option>
<option>Ensino Médio</option>
</select>
</div>

<div class="campo-form">
<label>Período</label>
<select id="editPeriodo">
<option value="">Selecione uma opção</option>
<option>Manhã</option>
<option>Tarde</option>
<option>Integral</option>
<option>Noite</option>
</select>
</div>

<div class="campo-form">
<label>Horário</label>
<input type="text" id="editHorario">
</div>

<div class="campo-form">
<label>Capacidade</label>
<input type="number" id="editCapacidade" required>
</div>

<div class="campo-form">
<label>Status da Turma</label>
<select id="editStatusTurma">
<option>Ativa</option>
<option>Concluída</option>
<option>Inativa</option>
</select>
</div>

<div class="campo-form">
<label>Ano Letivo</label>
<input type="number" id="editAnoLetivoTurma">
</div>

<div class="campo-form">
<label>Professor(a) da Turma</label>
<input type="text" id="editProfessorTurma">
</div>

<div class="modal-acoes">
<button type="button" class="btn-danger">
  <i class="fa-solid fa-trash"></i>
  Excluir
</button>

<button type="button" class="btn-cancelar">
  Cancelar
</button>

<button type="submit" class="btn-sec">
  Salvar
</button>
</div>

</form>

</div>
</div>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/core/layout.js"></script>
<script type="module" src="js/modules/turmas.js"></script>

</body>
</html>
