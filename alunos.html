            <a href="carometro.html">

            <a href="contato.html">

            <a href="declaracoes.html">
            <i class="fa-solid fa-file-signature"></i> Declarações

            <a href="funcionarios.html">

            </a>
        </nav>

    <!-- CONTEÚDO -->
    <main class="conteudo">

        <!-- ATALHOS POR TURMA -->
        <section class="card">
            <h2>Selecione uma turma</h2>

            <div id="atalhosTurmas" class="atalhos-turmas">
                <!-- botões gerados via JS -->
            </div>
        </section>

        <!-- LISTAGEM -->
        <section class="card">
            <h2>Alunos da Turma</h2>

            <div class="filtros-situacao">

                <button data-situacao="todos">Todos<span id="count-todos"></span></button>
                <button data-situacao="Ativo">Ativos<span id="count-ativo"></span></button>
                <button data-situacao="Inativo">Inativos<span id="count-inativo"></span></button>
                <button data-situacao="Transferido">Transferidos<span id="count-transferido"></span></button>
                <button data-situacao="Concluído">Concluídos<span id="count-concluido"></span></button>
                <button data-situacao="Desistente">Desistentes<span id="count-desistente"></span></button>
                <button data-situacao="Retido">Retidos<span id="count-retido"></span></button>
                <button data-situacao="Não comparecimento">Não comparecimento<span id="count-nao"></span></button>

            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>RGA</th>
                            <th>NOME DO ESTUDANTE</th>
                            <th>NASCIMENTO</th>
                            <th>TURMA</th>
                            <th>RA</th>
                            <th>EOL</th>
                            <th>INEP</th>
                            <th>SITUAÇÃO</th>
                            <th>AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="listaAlunos">
                        <tr>
                            <td colspan="3" style="text-align:center;">
                                Selecione uma turma acima
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
