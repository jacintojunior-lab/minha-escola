<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Apresentação de Estudante Novo</title>

<style>
@page{
  size:A4;
  margin:0;
}

*{
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  margin:0;
  background:#fff;
  color:#000;
}

.folha{
  width:210mm;
  height:297mm;
  margin:auto;
  padding:12mm 16mm;
}

.via{
  height:52mm;
  padding:5mm 4mm;
  border-top:1px dashed #777;
  position:relative;
}

.via + .via{
  margin-top:2mm;
}

.via:last-child{
  border-bottom:1px dashed #777;
}

h1{
  text-align:center;
  font-size:15px;
  margin:0 0 8mm;
  font-weight:bold;
}

p{
  font-size:14px;
  line-height:1.5;
  margin:4px 0;
}

.linha{
  display:inline-block;
  border-bottom:1px solid #000;
  height:16px;
  vertical-align:baseline;
}

.nome{
  width:115mm;
}

.serie{
  width:16mm;
}

.data{
  width:40mm;
}

.procurar{
  width:55mm;
}

.secretaria{
  margin-top:5mm;
  text-align: right;
}

.btn-print{
  position:fixed;
  top:20px;
  right:20px;
  background:#f4b400;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  z-index:999;
}

@media print{
  .btn-print{
    display:none;
  }

  .folha{
    margin:0;
  }
}
</style>
</head>

<body>

<button class="btn-print" onclick="window.print()">🖨️ Imprimir</button>

<div class="folha" id="folha"></div>

<script>
function criarVia(){
  return `
    <div class="via">
      <h1>APRESENTAÇÃO DE ESTUDANTE NOVO</h1>

      <p>
        Informamos que o(a) estudante
        <span class="linha nome"></span>
      </p>

      <p>
        foi matriculado(a) nesta Unidade Escolar na
        <span class="linha serie"></span>
        série
        <span class="linha serie"></span>
        no dia
        <span class="linha data"></span>.
      </p>

      <p>
        Procurar por
        <span class="linha procurar"></span>.
      </p>

      <p class="secretaria">
        A secretaria.
      </p>
    </div>
  `
}

document.getElementById("folha").innerHTML =
  Array.from({ length: 5 }, criarVia).join("")
</script>

</body>
</html>
